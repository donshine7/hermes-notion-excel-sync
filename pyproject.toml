[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notion-excel-sync"
version = "0.6.9"
description = "Approval-gated immutable local Excel to Notion synchronization orchestrated by Hermes"
requires-python = ">=3.11"
dependencies = [
  "msal>=1.31,<2",
  "msal-extensions>=1.3,<2",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
notion-excel-sync = "notion_excel_sync.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
